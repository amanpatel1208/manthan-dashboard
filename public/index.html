<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mathan Institute of Career Development - Tutor dashboard for students, fees, attendance, tests and more">
    <meta name="theme-color" content="#F3EFE6">
    <title>Mathan Institute of Career Development</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('manthan_theme');
                if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) {}
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#contentArea" class="skip-link">Skip to content</a>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <button type="button" class="theme-toggle login-theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
        <div class="login-bg-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">
                        <div class="logo-icon"><i class="fas fa-graduation-cap" aria-hidden="true"></i></div>
                        <span class="login-kicker">Tutor workspace</span>
                        <h1>Mathan Institute</h1>
                        <p>of Career Development</p>
                    </div>
                </div>
                <form id="loginForm" class="login-form">
                    <div class="role-selector">
                        <button type="button" class="role-btn active" data-role="admin"><i class="fas fa-user-shield"></i> Tutor</button>
                        <button type="button" class="role-btn" data-role="student"><i class="fas fa-user-graduate"></i> Student</button>
                    </div>
                    <input type="hidden" id="loginRole" value="admin">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Username</label>
                        <input type="text" id="loginUsername" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
                    <div id="loginError" class="login-error"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="main-app hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <button type="button" id="sidebarLogo" class="sidebar-logo" aria-label="Collapse sidebar" title="Collapse sidebar">
                    <i class="fas fa-graduation-cap" aria-hidden="true"></i>
                    <span>Mathan Institute</span>
                </button>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
                <!-- Populated by JS based on role -->
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar"><i class="fas fa-user"></i></div>
                    <div class="user-details">
                        <span id="userName" class="user-name">Admin</span>
                        <span id="userRole" class="user-role">Administrator</span>
                    </div>
                </div>
                <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <!-- Mobile sidebar backdrop -->
        <div id="mobileOverlay" class="mobile-overlay hidden" onclick="closeMobileSidebar()" aria-hidden="true"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Open menu"><i class="fas fa-bars" aria-hidden="true"></i></button>
                    <div class="breadcrumb">
                        <span id="pageTitle">Dashboard</span>
                    </div>
                </div>
                <div class="top-bar-right">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="globalSearch" placeholder="Search students…" aria-label="Search students" autocomplete="off" aria-expanded="false" aria-controls="globalSearchResults">
                        <div id="globalSearchResults" class="search-results hidden" role="listbox" aria-label="Student search results"></div>
                    </div>
                    <button type="button" class="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
                    <button type="button" class="notification-bell" id="notificationBell" title="Notifications" aria-label="Notifications">
                        <i class="fas fa-bell"></i>
                        <span class="badge" id="notifBadge">0</span>
                    </button>
                    <div class="top-bar-date">
                        <i class="fas fa-calendar-alt"></i>
                        <span id="currentDate"></span>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area" id="contentArea" tabindex="-1">
                <!-- Dynamically loaded content -->
            </div>
        </main>
    </div>

    <!-- Notification Panel -->
    <div id="notifPanel" class="notif-panel hidden">
        <div class="notif-header">
            <h3><i class="fas fa-bell"></i> Notifications</h3>
            <div class="notif-actions">
                <button class="notif-mark-all" onclick="markAllNotificationsRead()" title="Mark all as read" aria-label="Mark all notifications as read"><i class="fas fa-check-double" aria-hidden="true"></i></button>
                <button onclick="document.getElementById('notifPanel').classList.add('hidden')" title="Close" aria-label="Close notifications"><i class="fas fa-times" aria-hidden="true"></i></button>
            </div>
        </div>
        <div id="notifList" class="notif-list"></div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal hidden">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content" id="modalContent"></div>
    </div>

    <!-- Toast -->
    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- Socket.IO client loaded from CDN for Netlify & Render compatibility -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="bundle.js"></script>
</body>
</html>
